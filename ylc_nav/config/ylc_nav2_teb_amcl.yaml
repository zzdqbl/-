amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.9   #里程计的旋转估计中来自旋转的预期过程噪声
    alpha2: 0.1   #里程计的旋转估计中来自平移的预期过程噪声
    alpha3: 0.05  #里程计的翻译估计中来自translation的预期过程噪声
    alpha4: 0.01  #里程计的平移估计中因旋转而产生的预期过程噪声
    alpha5: 0.04  #仅适用于 Omni 型号：translation噪音
    base_frame_id: "base_footprint" #机器人底座框架 
    beam_skip_distance: 0.5         #忽略似然场模型中大多数粒子不同意的光束。考虑跳过的最大距离（米）
    beam_skip_error_threshold: 0.9  #由于收敛性不好，未匹配地图后强制进行完全更新的光束百分比
    beam_skip_threshold: 0.3        #需要跳过的光束的百分比。
    do_beamskip: false              #是否在似然场模型中进行波束跳跃
    global_frame_id: "map"          #定位系统发布的坐标框架的名称
    lambda_short: 0.1               #模型 z_short 部分的指数衰减参数
    laser_likelihood_max_dist: 2.0  #在地图上进行障碍物膨胀的最大距离，用于似然场模型
    laser_max_range: 100.0          #要考虑的最大扫描范围，-1.0 将导致使用激光报告的最大范围
    laser_min_range: -1.0           #要考虑的最小扫描范围，-1.0 将导致使用激光报告的最小范围
    laser_model_type: "likelihood_field" #使用哪种模型，
    #beam、likelihood_field 或 unlikely_field_prob。与 unlikely_field 相同，但如果启用，则包含 beamskip 功能
    max_beams: 60                   #更新过滤器时每次扫描要使用多少个均匀分布的光束。
    max_particles: 2000             #允许的最大粒子数
    min_particles: 500              #允许的最小粒子数
    odom_frame_id: "odom_combined"  #使用哪个框架进行里程计
    pf_err: 0.02                    #粒子过滤器群体误差
    pf_z: 0.85                      #粒子过滤器群体密度
    recovery_alpha_fast: 0.0        #快速平均权重过滤器的指数衰减率，用于决定何时通过添加随机姿势进行恢复。
    recovery_alpha_slow: 0.0        #慢速平均权重过滤器的指数衰减率，用于决定何时通过添加随机姿势进行恢复。
    resample_interval: 2            #重采样之前所需的过滤器更新次数
    robot_model_type: "nav2_amcl::DifferentialMotionModel" #插件类的完全限定类型。
    #选项为“nav2_amcl::DifferentialMotionModel”和“nav2_amcl::OmniMotionModel”。
    save_pose_rate: 0.5             #将最后估计的姿势和协方差存储到参数服务器的最大速率（Hz）
    sigma_hit: 0.02                 #模型的 z_hit 部分中使用的高斯模型的标准差
    tf_broadcast: true              #将其设置为 false 以防止 amcl 发布全局框架和里程计框架之间的变换
    transform_tolerance: 0.5        #发布转换的容差
    update_min_a: 0.06              #执行过滤器更新之前需要进行旋转运动。
    update_min_d: 0.025             #执行过滤器更新之前需要进行平移运动
    z_hit: 0.7                      #模型的 z_hit 部分的混合权重，所有使用的 z 权重之和必须为 1。
    z_max: 0.001                    #模型的 z_max 部分的混合权重，所有使用的 z 权重之和必须为 1。
    z_rand: 0.059                   #模型的 z_rand 部分的混合权重，所有使用的 z 权重之和必须为 1。
    z_short: 0.24                   #模型中 z_short 部分的混合权重，所有使用的 z 权重之和必须为 1。
    scan_topic: scan                #要订阅的激光雷达

    # Initial Pose
    set_initial_pose: True #AMCL 从 initial_pose* 参数设置初始姿势，而不是等待 initial_pose 消息
    initial_pose.x: 0.0
    initial_pose.y: 0.0
    initial_pose.z: 0.0
    initial_pose.yaw: 0.0
    #Amcl参数解释参考：https://docs.nav2.org/configuration/packages/configuring-amcl.html
    always_reset_initial_pose: false
    first_map_only: true
    tf_good_pose_timeout: 1.0
    initial_manhattan_pose: false 

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False


bt_navigator:
  ros__parameters:
    use_sim_time: False
    transform_tolerance: 0.5
    goal_reached_tol: 0.25
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom_combined
    bt_loop_duration: 10
    default_server_timeout: 20

    max_recovery_retries: 2        # 只重试1次就放弃
    retry_behavior_tree: false     # 禁止行为树无限循环死磕

    default_nav_through_poses_bt_xml: "/userdata/dev_ws/src/origincar/ylc_nav/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    default_nav_to_pose_bt_xml: "/userdata/dev_ws/src/origincar/ylc_nav/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    error_code_names:
      - compute_path_error_code 
      - follow_path_error_code

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.05            # 防止静止抖动
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.05
    odom_topic: /odom_combined
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10           # 小车移动距离短，调小
      movement_time_allowance: 15.0
    goal_checker: 
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.3
      stateful: True

    FollowPath:
      plugin: "teb_local_planner::TebLocalPlannerROS"
      # ============================ 机器人运动学配置 ============================
      is_robot_holonomic: false                  # 非全向机器人（阿克曼/差速必须为false）
      
      # min_turning_radius: $(eval wheelbase / sin(max_steer_angle_rad))                   # 阿克曼最小转弯半径(m)，必须按实车设置
      min_turning_radius: 0.42
      # weight_kinematics_h: 1000.0                 # 全向运动学惩罚权重
      weight_kinematics_nh: 1000.0                # 非全向运动学惩罚权重（阿克曼建议大值）
      weight_kinematics_forward_drive: 100.0     # 强制前进惩罚权重，阿克曼强烈建议开启4.1/100?
      weight_adapt_factor: 1.0                    # 权重自适应系数

      # ============================ 速度限制配置 ============================
      max_vel_x: 0.5                             # 最大前进速度(m/s)
      min_vel_x: 0.0                              # 最小前进速度(m/s)
      max_vel_y: 0.0                              # 侧向速度（阿克曼固定为0）
      max_vel_theta: 1.5                         # 最大转向角速度(rad/s)2.0
      min_vel_theta: -1.5                        # 最小转向角速度(rad/s)
      max_vel_x_backwards: 0.5                    # 最大倒车速度(m/s)
      min_abs_vel_x: 0.05                         # 最小线速度阈值，避免低速抖动
      min_abs_vel_theta: 0.05                      # 最小角速度阈值
      sim_time: 2.0
      # ============================ 加减速限制配置 ============================
      acc_lim_x: 0.5                             # 前进线加速度(m/s²)0.6
      acc_lim_y: 0.0                              # 侧向加速度（阿克曼固定为0）
      acc_lim_theta: 0.8                         # 角加速度(rad/s²)1.5
      decel_lim_x: -1.0                           # 前进线减速度(m/s²)
      decel_lim_y: 0.0                            # 侧向减速度
      decel_lim_theta: -0.8                      # 角减速度(rad/s²)

      # ============================ 机器人轮廓/碰撞配置 ============================
      footprint_model:
        type: "polygon"                           # 轮廓类型：polygon多边形
        vertices: "[[-0.2, -0.115], [-0.2, 0.115], [0.2, 0.115], [0.2, -0.115]]"  # 车身坐标

      # ============================ 目标点到达精度 ============================
      xy_goal_tolerance: 0.15                     # 位置目标误差(m)10
      yaw_goal_tolerance: 0.3                    # 角度目标误差(rad)15
      free_goal_vel: false                       # 到达目标是否允许带速度（建议false）

      # ============================ 全局路径跟随配置 ============================
      max_global_plan_lookahead_dist: 2.2        # 全局路径最大前瞻距离3.31/0.6
      feasibility_check_no_poses: 3               # 连续检查轨迹点数量
      global_plan_viapoint_sep: 0.5               # 全局路径采样间隔

      # ============================ 障碍物与避障配置 ============================
      min_obstacle_dist: 0.25                     # 与障碍物最小安全距离3.31 /0.22
      inflation_dist: 0.30                        # 障碍物膨胀距离3.31/0.35
      include_costmap_obstacles: true             # 融合代价地图静态障碍物
      costmap_obstacle_behind: true              # 是否检测车身后方障碍物
      include_dynamic_obstacles: true             # 融合动态障碍物
      obstacle_poses_affected: 30                 # 障碍物影响的轨迹点数量
      #costmap_converter_plugin: "costmap_converter::CostmapToPolygonsDBSMCCH"  # 代价地图转换插件
      costmap_converter_plugin: ""
      # ============================ 倒车与多轨迹配置 ============================
      include_backward_motion: true               # 允许倒车（阿克曼建议开启）
      max_number_vehs: 1                          # 最大备选轨迹数量

      # ============================ 轨迹优化权重配置 ============================
      weight_optimaltime: 40.0                    # 时间最优的权重
      weight_kinematics_turning_radius: 2000.0      # 遵守最小转弯半径的权重（阿克曼关键！）
      weight_velocity: 10.0                        # 速度权重
      weight_acceleration: 8.0                   # 加速度权重
      weight_obstacle: 15.0                       # 静态避障权重
      weight_inflation: 1.0                       # 膨胀区权重
      weight_dynamic_obstacle: 30.0               # 动态障碍权重
      weight_point: 50.0                           # 路径点跟随权重
      weight_speed: 1.0                           # 速度权重（兼容旧版）
      weight_acc: 1.0                             # 加速度权重（兼容旧版）
      weight_kinematics: 0.5                      # 运动学权重（兼容旧版）
      weight_goal: 20.0                           # 目标点权重
      weight_prefer_rotdir: 0.0                  # 优先转向方向权重
      weight_time: 1.50
      weight_max_vel_x: 2.0            # 惩罚超过最大线速度的权重
      weight_acc_lim_x: 1.0            # 惩罚超过加速度极限的权重
      # ============================ 优化器配置 ============================
      optimization_activate: true                  # 开启轨迹优化
      optimization_verbose: false                 # 关闭详细优化日志
      penalty_epsilon: 0.2                        # 优化惩罚系数0.1
      optimization_epsilon: 0.1                 # 迭代收敛精度0.05/3.30
      no_inner_iterations: 3                      # 优化内迭代次数3
      no_outer_iterations: 2                     # 优化外迭代次数2
      max_traversal_time: 15.0                    # 单段轨迹最大执行时间(s)15/3.30

      # ============================ 轨迹时间与采样配置 ============================
      teb_autoresize: true
      dt_ref: 0.20                                 # 轨迹时间参考步长3.31/0.4
      dt_hysteresis: 0.1                          # 步长滞后范围
      min_samples: 6                              # 轨迹最小采样点数
      max_samples: 20                             # 轨迹最大采样点数25

      # ============================ 同伦类规划（多路径） ============================
      enable_homotopy_planning: false              # 开启多路径规划
      max_number_classes: 2                       # 最大路径类别数量

      # ============================ 震荡检测与恢复 ============================
      oscillation_recovery: true                  # 开启震荡检测与恢复
      oscillation_v_eps: 0.1         # 判断振荡的线速度阈值
      oscillation_omega_eps: 0.1     # 判断振荡的角速度阈值
      oscillation_recovery_min_duration: 5.0
      shrink_horizon_backup: true                 # 异常时自动缩短轨迹规划范围
      shrink_horizon_min_duration: 2.0
      # ============================ 轨迹选择策略 ============================
      allow_initial_with_orientation: true        # 允许初始带方向
      selection_criteria: 0                        # 轨迹选择标准
      selection_cost_weight: 1.0                  # 选择代价权重
      selection_prefer_initial_plan: 0.95          # 偏好初始全局路径
      selection_alternative_time_cost: true         # 时间代价权重
      selection_obstacle_cost_exponent: 4.0       # 障碍代价指数

      # ============================ 运行频率配置 ============================
      control_rate: 20.0                           # TEB控制器运行频率(Hz)

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom_combined
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      ############？true 4.1
      width: 4
      height: 4
      resolution: 0.1
      
      footprint: "[ [-0.2, -0.115], [-0.2, 0.115], [0.2, 0.115], [0.2, -0.115] ]"
      
      plugins: ["obstacle_layer","inflation_layer"]
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        inflation_radius: 0.18 
     
        cost_scaling_factor: 20.0     
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          raytrace_max_range: 4.0
          raytrace_min_range: 0.1
          obstacle_max_range: 3.5
          obstacle_min_range: 0.1
          clearing: True
          marking: True
          queue_size: 3
      
      always_send_full_costmap: True

  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      downsample_costmap: true
      downsampling_factor: 2  

      static_map: true     
      rolling_window: false  
      width: 10           
      height: 10
      footprint: "[ [-0.2, -0.115], [-0.2, 0.115], [0.2, 0.115], [0.2, -0.115] ]"
      
      resolution: 0.1
      track_unknown_space: true

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 1.5
          obstacle_min_range: 0.0
      
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        
        inflation_radius: 0.18      
        cost_scaling_factor: 20.0     
      
      always_send_full_costmap: True

  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "turtlebot3_world.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    use_sim_time: False
    expected_planner_frequency: 5.0
    default_tolerance: 1.5 
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 1.5
      downsample_costmap: true
      downsampling_factor: 2
      allow_unknown: true
      max_iterations: 25000
      max_on_approach_iterations: 1000
      max_planning_time: 0.5
      
      motion_model_for_search: "REEDS_SHEPP"

      cost_travel_multiplier: 10.0
      angle_quantization_bins: 64
      analytic_expansion_ratio: 3.5

      min_turning_radius: 0.40

      reverse_penalty: 100.0
      change_penalty: 0.1
      non_straight_penalty: 0.2
      
      cost_penalty: 4.5
      lookup_table_size: 8.0
      cache_obstacle_heuristic: True
      smoother:
        max_iterations: 1000
        w_smooth: 0.4
        w_data: 0.2
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["wait"]

    wait:
      plugin: "nav2_behaviors/Wait"
      wait_time: 0.1

    global_frame: odom_combined
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.4
    min_rotational_vel: 0.05
    rotational_acc_lim: 2.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    loop_rate: 15
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

