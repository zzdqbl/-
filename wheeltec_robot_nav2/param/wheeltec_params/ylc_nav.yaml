slam_toolbox:
  ros__parameters:
    # ================= 基础系统配置 =================
    # 是否使用仿真时间。真机运行必须设为 False，否则时间戳对不上会导致定位跳变。
    use_sim_time: False
    # 【关键】里程计坐标系名称。SLAM 依赖此坐标系作为初始位置猜测。
    # 如果这个坐标系本身漂移严重（推车时激光点不贴墙），SLAM 无法修正。
    odom_frame: odom_combined
    # 机器人底盘坐标系名称。激光数据会转换到此坐标系进行计算。
    base_frame: base_footprint
    # 全局地图坐标系名称。SLAM 会发布 map -> odom_combined 的变换来修正误差。
    global_frame: map
    # 订阅的激光雷达话题名称。
    scan_topic: /scan
    # 运行模式：'mapping' (建图) 或 'localization' (纯定位)。
    mode: mapping
    # ================= 激光雷达数据预处理 =================
    # 【抗幻觉关键】最大有效雷达距离 (米)。
    # 设为 5.0 可以过滤掉远处的噪声和动态物体，只关注近处可靠特征，显著减少误匹配。
    max_laser_range: 3.0
    # 最小有效雷达距离 (米)。过滤掉机器人本体遮挡或太近无法测量的噪点。
    min_laser_range: 0.2
    # TF 变换允许的最大时间误差 (秒)。超过此值的数据帧会被丢弃，防止使用过期的位姿。
    transform_tolerance: 0.05
    # ================= 运行频率与队列 =================
    # SLAM 内部算法更新频率 (Hz)。
    update_frequency: 5.0
    # 发布地图和 TF 变换的频率 (Hz)。5-10Hz 通常足够，过高增加 CPU 负担。
    publish_frequency: 5.0
    # 输入扫描队列大小。适当增大可防止因 CPU 瞬时负载高而丢帧。
    scan_queue_size: 20
    # 激光数据处理速率。如果雷达频率高于此值，会进行降采样。
    laser_processing_rate: 15.0
    # 内部最大队列大小。
    max_queue_size: 30
    # ================= 扫描匹配 (Scan Matching) - 核心定位逻辑 =================
    # 这部分参数直接决定定位是否会出现“幻觉”或“跳变”。
    # 是否启用扫描匹配算法。必须为 true 才能修正里程计误差。
    use_scan_matching: true
    # 优化过程中尝试的初始猜测位置数量。
    # 增大此值 (如 30) 可以让算法在里程计漂移较大时仍有概率找到正确位置，但会增加 CPU 消耗。
    scan_matching_max_candidates: 15
    # 【抗幻觉关键】匹配分数的最低阈值 (0.0 - 1.0)。
    # 0.70 意味着只有相似度超过 70% 才接受匹配。
    # 调高 (如 0.75) 可减少幻觉，但可能导致特征少时跟丢；调低 (如 0.60) 容易乱飘。
    scan_matching_score_min: 0.70
    # ================= 闭环检测 (Loop Closure) =================
    # 用于识别“回到了原点”，消除长距离累积误差。
    # 是否启用闭环检测。
    loop_closing: true
    # 【抗幻觉关键】闭环搜索半径 (米)。
    # 限制只在周围 3 米内寻找闭环，防止将远处相似的走廊错误地匹配在一起（错误闭环）。
    search_radius: 3.0  
    # 进行闭环匹配时的最大雷达距离。
    max_laser_range_loop: 3.0
    # 闭环匹配允许的 XY 位置方差上限。越小越严格，防止错误的闭环修正。
    loop_match_max_variance_xy: 0.15 
    # 闭环匹配允许的角度方差上限。
    loop_match_angle_variance: 0.15
    # ================= 运动触发更新 (防抖动) =================
    # 防止机器人在原地微小晃动时，SLAM 频繁更新导致地图出现重影或噪点。
    # 机器人必须移动至少这么多米，才处理新的一帧数据。
    # 如果静止时地图闪烁，可适当增大此值 (如 0.1)。
    minimum_travel_distance: 0.05
    # 机器人必须旋转至少这么多弧度，才处理新的一帧数据。
    # 如果原地微调方向时地图模糊，可适当增大此值 (如 0.1)。
    minimum_travel_heading: 0.05
    # ================= 初始化与输出 =================
    # 初始位置设定 (仅在纯定位模式或重置时使用)。
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_yaw: 0.0
    # 是否计算并发布定位协方差 (不确定度)。
    compute_covariance: true
    # 是否允许在检测到闭环后优化整个轨迹图。
    add_loop_closures: true 
    # 是否发布 map -> odom 的 TF 变换 (导航必需)。
    publish_tf: true
    # 是否在 /map 话题发布占据栅格地图。
    publish_map: true

bt_navigator:
  ros__parameters:
    use_sim_time: False
    transform_tolerance: 0.1
    goal_reached_tol: 0.25
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom_combined
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_through_poses_bt_xml: "/userdata/dev_ws/src/origincar/ylc_nav/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    default_nav_to_pose_bt_xml: "/userdata/dev_ws/src/origincar/ylc_nav/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    error_code_names:
      - compute_path_error_code 
      - follow_path_error_code

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 50.0
    min_x_velocity_threshold: 0.05            # 防止静止抖动
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    odom_topic: /odom_combined
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10           # 小车移动距离短，调小
      movement_time_allowance: 15.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.3
      stateful: True

    FollowPath:
      plugin: "ackermann_rpp_controller_3_24::AckermannRppController"
      # --- 速度基础 ---
      desired_linear_vel: 0.4
      
      angular_pid:
        kp: 2.5           # 比例系数：误差越大，转向越快
        ki: 0.0           # 积分系数：消除稳态误差 (如持续偏航)
        kd: 0.0           # 微分系数：抑制震荡，增加阻尼
        output_min: -1.5  # 角速度输出下限 (rad/s)，限制最大转向速度
        output_max: 1.5   # 角速度输出上限 (rad/s)
        offset: 0.0       # 中位点偏置：如果车总是自动往一边跑，微调这个值 (例如 0.02)
        max_integral: 10.0 # 积分限幅：防止积分饱和 (Anti-windup)      

      # --- 路径跟随 (防抄近道) ---
      lookahead_dist: 1.0                     # 小车灵活，前瞻可以稍小
      min_lookahead_dist: 0.6
      max_lookahead_dist: 1.5
      lookahead_time: 0.0
      use_velocity_scaled_lookahead_dist: false
      
      # 👇 关键：极小搜索距离，严禁跳跃
      max_robot_pose_search_dist: 0.15        
      
      # 👇 关键：关闭插值，严禁画圆弧切内道
      use_interpolation: false      

      # --- 动力学与安全 (阿克曼特化) ---
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      
      # ✅ 曲率缩放：修正半径匹配
      use_regulated_linear_velocity_scaling: true
      # 👇 修正：必须 >= 规划器的 minimum_turning_radius (0.35)
      regulated_linear_scaling_min_radius: 0.38 
      regulated_linear_scaling_min_speed: 0.10  # 允许更慢的蠕行

      # ✅ 代价缩放：修正膨胀半径匹配
      use_cost_regulated_linear_velocity_scaling: true
      # 👇 修正：必须 >= inflation_radius (0.18)
      cost_scaling_dist: 0.25       
      cost_scaling_gain: 4.0          # 👈 增大增益！靠近障碍物时剧烈减速
      inflation_cost_scaling_factor: 1.8 # 👈 与 costmap 保持一致

      # --- 阿克曼运动学约束 ---
      rotate_to_heading_angular_vel: 0.0
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 2.0          
      
      # --- 倒车配置 (安全优先) ---
      allow_reversing: true           
      # 👇 关键：阿克曼倒车必须极慢！0.28 必撞无疑
      max_backward_linear_vel: 0.10   
      max_backward_ang_vel: 0.15      

      # --- 其他 ---
      transform_tolerance: 0.1
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.0
      goal_dist_tol: 0.15
      yaw_goal_tolerance: 0.1


      # plugin: "ylc_nav_rpp/AckermannRPP"
      # #plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # # --- #########PID和轮轴轮距ylc ---
      # wheel_track: 0.185                       # 👈 新增：实测左右轮距18.5cm=0.185m
      # vehicle_wheelbase: 0.17
      # vehicle_max_steer_angle: 0.41 
      # min_rotate_speed: 0.12                 
      # kp_angle: 1.76
      # ki_angle: 0.0
      # kd_angle: 1.07

      # # --- #########限制速度和角度 ---
      # rotate_angle_threshold: 0.18      # 大于此角度 (rad) 触发 PID 旋转
      # max_backward_vel: 0.250
      # #------ylc
      # # --- 速度基础 ---
      # desired_linear_vel: 1.0
      # turn_linear_vel: 0.5      # 弯道跑多快
      # # --- 路径跟随 (防抄近道) ---
      # lookahead_dist: 0.4                     # 小车灵活，前瞻可以稍小
      # min_lookahead_dist: 0.15
      # max_lookahead_dist: 0.6
      # lookahead_time: 0.3
      # use_velocity_scaled_lookahead_dist: true
      # #lookahead_dist: 1.0                     # 小车灵活，前瞻可以稍小
      # # min_lookahead_dist: 0.6
      # # max_lookahead_dist: 1.5
      # # lookahead_time: 0.0
      # # use_velocity_scaled_lookahead_dist: false
      # # 👇 关键：极小搜索距离，严禁跳跃
      # max_robot_pose_search_dist: 0.15        
      
      # # 👇 关键：关闭插值，严禁画圆弧切内道
      # use_interpolation: false      

      # # --- 动力学与安全 (阿克曼特化) ---
      # use_collision_detection: true
      # max_allowed_time_to_collision_up_to_carrot: 0.5
      
      # # ✅ 曲率缩放：修正半径匹配
      # use_regulated_linear_velocity_scaling: true
      # # 👇 修正：必须 >= 规划器的 minimum_turning_radius (0.35)
      # regulated_linear_scaling_min_radius: 0.48 ######################倒车
