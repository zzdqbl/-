      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom_combined
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      ############？true 4.1
      width: 3
      height: 3
      resolution: 0.1
      
      # 👇 关键修正：Footprint 必须匹配实际车宽 (0.22m)
      # 长 0.4m (前后各留一点), 宽 0.23m (实际 0.22 + 0.01 余量)
      footprint: "[ [-0.2, -0.115], [-0.2, 0.115], [0.2, 0.115], [0.2, -0.115] ]"
      
      plugins: ["obstacle_layer","inflation_layer"]
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 👇 关键修正：小车不需要 0.33 这么大的膨胀半径！
        # 0.18m 意味着离障碍物 18cm 开始有代价，对 22cm 宽的车足够了
        inflation_radius: 0.25 #!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!3.19---0.35!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!   
        # 👈 增大衰减因子，让代价只在很近的地方才高4.7/0.28
        cost_scaling_factor: 25.0     
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          raytrace_max_range: 4.0
          raytrace_min_range: 0.1
          obstacle_max_range: 3.5
          obstacle_min_range: 0.1
          clearing: True
          marking: True
          queue_size: 3
      
      always_send_full_costmap: True

  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      downsample_costmap: true
      downsampling_factor: 2  # 压缩倍数，2 是最常用的平衡点
      # 👇 关键修正：全局足迹也要改
      # static_map: false       # 关键！没有固定地图
      # rolling_window: true    # 关键！地图跟着车走
      # width: 10            # 滚动窗口大小 12m × 12m
      # height: 10
      footprint: "[ [-0.2, -0.115], [-0.2, 0.115], [0.2, 0.115], [0.2, -0.115] ]"
      
      resolution: 0.1
      track_unknown_space: true
      ########false 4.1
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 1.5
          obstacle_min_range: 0.0
      
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 👇 关键修正：全局膨胀半径也要缩小到 0.18
        inflation_radius: 0.25       #!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!3.19---0.35!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!   
        cost_scaling_factor: 25.0     
      
      always_send_full_costmap: True

  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "turtlebot3_world.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

