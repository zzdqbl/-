controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom_combined
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.05
      
      # 👇 关键修正：Footprint 必须匹配实际车宽 (0.22m)
      # 长 0.4m (前后各留一点), 宽 0.23m (实际 0.22 + 0.01 余量)
      footprint: "[ [-0.2, -0.115], [-0.2, 0.115], [0.2, 0.115], [0.2, -0.115] ]"
      
      plugins: ["obstacle_layer","inflation_layer"]
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 👇 关键修正：小车不需要 0.33 这么大的膨胀半径！
        # 0.18m 意味着离障碍物 18cm 开始有代价，对 22cm 宽的车足够了
        inflation_radius: 0.28 #!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!3.19---0.35!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!   
        # 👈 增大衰减因子，让代价只在很近的地方才高
        cost_scaling_factor: 10.0     
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          raytrace_max_range: 4.0
          raytrace_min_range: 0.1
          obstacle_max_range: 3.5
          obstacle_min_range: 0.1
          clearing: True
          marking: True
          queue_size: 3
      
      always_send_full_costmap: True

  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      
      # 👇 关键修正：全局足迹也要改
      footprint: "[ [-0.2, -0.115], [-0.2, 0.115], [0.2, 0.115], [0.2, -0.115] ]"
      
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 1.5
          obstacle_min_range: 0.0
      
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 👇 关键修正：全局膨胀半径也要缩小到 0.18
        inflation_radius: 0.35       #!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!3.19---0.35!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!   
        cost_scaling_factor: 10.0     
      
      always_send_full_costmap: True

  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "turtlebot3_world.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    use_sim_time: False
    expected_planner_frequency: 10.0
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.3                      # 小车精度要求高，容差调小
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 250000
      max_on_approach_iterations: 1000
      max_planning_time: 3.5
      motion_model_for_search: "REEDS_SHEPP"

      cost_travel_multiplier: 10.0 ##3.22——18
      # 这也是一个乘数，用于平衡“行驶距离”和“地图代价值”之间的权重。10！！！！
      # 如果路径太长但很安全，或者路径很短但很危险，这个参数用来权衡。通常与 cost_penalty 配合使用。
      angle_quantization_bins: 64
      analytic_expansion_ratio: 3.5
      
      # 👇 关键修正：最小转弯半径
      # 0.22m 宽的小车，通常转弯半径在 0.3~0.4m 左右
      # 如果实际车更小，可以试着降到 0.30
      minimum_turning_radius: 0.35      
      
      reverse_penalty: 5.0
      change_penalty: 0.2
      non_straight_penalty: 1.0   
      # non_straight_penalty含义：非直线行驶惩罚（转弯惩罚）。
      # 作用：当小车转弯（而不是走直线）时，路径成本会增加。
      # 效果：
      # 设得大：小车喜欢走直线，只有在必须避障或掉头时才转弯，路径会比较生硬（折线多）。
      # 设得小：小车不介意频繁转弯，路径可能更平滑但也更琐碎。
      
      cost_penalty: 3.0   #!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!3.19---10.0/3.2225!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
      # 含义：代价值乘数。
      # 作用：它将代价地图（Costmap）上的原始代价值（0~255）放大 10 倍后计入路径总成本。
      # 公式逻辑：路径段成本 = 距离 + (地图代价值 * cost_penalty)。
      # 效果：
      # 调大 (如 20.0)：规划器极度厌恶靠近障碍物（蓝色区域）。它会绕很远的路也要走在白色（自由空间）中心。路径非常安全，但可能绕远。
      # 调小 (如 2.0)：规划器不太在乎靠近障碍物。它可能会贴着蓝色区域边缘走，甚至穿过浅蓝色区域以缩短距离。路径更短，但风险更高。
      # 关联：这就是控制规划器如何利用你之前调整的 inflation_radius 和 cost_scaling_factor 的关键参数。
      lookup_table_size: 8.0
      cache_obstacle_heuristic: True
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "wait", "drive_on_heading"]
    
    spin:
      plugin: "nav2_behaviors/Spin"
      spin_speed: 0.3                     # 小车惯性小，可以更慢更稳
    
    backup:
      plugin: "nav2_behaviors/BackUp"
      # 👇 关键修正：倒车速度必须 <= controller 的 max_backward_linear_vel (0.10)
      backup_speed: 0.08                  
      backup_dist: 0.3                    # 只退一点点
    
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
      drive_speed: 0.20                   # 恢复前进也要慢
    
    wait:
      plugin: "nav2_behaviors/Wait"
      wait_time: 1.0
    
    global_frame: odom_combined
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.4
    min_rotational_vel: 0.05
    rotational_acc_lim: 2.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    loop_rate: 15
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
