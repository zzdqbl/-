amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.9   #里程计的旋转估计中来自旋转的预期过程噪声
    alpha2: 0.1   #里程计的旋转估计中来自平移的预期过程噪声
    alpha3: 0.05  #里程计的翻译估计中来自translation的预期过程噪声
    alpha4: 0.01  #里程计的平移估计中因旋转而产生的预期过程噪声
    alpha5: 0.04  #仅适用于 Omni 型号：translation噪音
    base_frame_id: "base_footprint" #机器人底座框架 
    beam_skip_distance: 0.5         #忽略似然场模型中大多数粒子不同意的光束。考虑跳过的最大距离（米）
    beam_skip_error_threshold: 0.9  #由于收敛性不好，未匹配地图后强制进行完全更新的光束百分比
    beam_skip_threshold: 0.3        #需要跳过的光束的百分比。
    do_beamskip: false              #是否在似然场模型中进行波束跳跃
    global_frame_id: "map"          #定位系统发布的坐标框架的名称
    lambda_short: 0.1               #模型 z_short 部分的指数衰减参数
    laser_likelihood_max_dist: 2.0  #在地图上进行障碍物膨胀的最大距离，用于似然场模型
    laser_max_range: 100.0          #要考虑的最大扫描范围，-1.0 将导致使用激光报告的最大范围
    laser_min_range: -1.0           #要考虑的最小扫描范围，-1.0 将导致使用激光报告的最小范围
    laser_model_type: "likelihood_field" #使用哪种模型，
    #beam、likelihood_field 或 unlikely_field_prob。与 unlikely_field 相同，但如果启用，则包含 beamskip 功能
    max_beams: 60                   #更新过滤器时每次扫描要使用多少个均匀分布的光束。
    max_particles: 2000             #允许的最大粒子数
    min_particles: 500              #允许的最小粒子数
    odom_frame_id: "odom_combined"  #使用哪个框架进行里程计
    pf_err: 0.02                    #粒子过滤器群体误差
    pf_z: 0.85                      #粒子过滤器群体密度
    recovery_alpha_fast: 0.0        #快速平均权重过滤器的指数衰减率，用于决定何时通过添加随机姿势进行恢复。
    recovery_alpha_slow: 0.0        #慢速平均权重过滤器的指数衰减率，用于决定何时通过添加随机姿势进行恢复。
    resample_interval: 2            #重采样之前所需的过滤器更新次数
    robot_model_type: "nav2_amcl::DifferentialMotionModel" #插件类的完全限定类型。
    #选项为“nav2_amcl::DifferentialMotionModel”和“nav2_amcl::OmniMotionModel”。
    save_pose_rate: 0.5             #将最后估计的姿势和协方差存储到参数服务器的最大速率（Hz）
    sigma_hit: 0.02                 #模型的 z_hit 部分中使用的高斯模型的标准差
    tf_broadcast: true              #将其设置为 false 以防止 amcl 发布全局框架和里程计框架之间的变换
    transform_tolerance: 0.5        #发布转换的容差
    update_min_a: 0.06              #执行过滤器更新之前需要进行旋转运动。
    update_min_d: 0.025             #执行过滤器更新之前需要进行平移运动
    z_hit: 0.7                      #模型的 z_hit 部分的混合权重，所有使用的 z 权重之和必须为 1。
    z_max: 0.001                    #模型的 z_max 部分的混合权重，所有使用的 z 权重之和必须为 1。
    z_rand: 0.059                   #模型的 z_rand 部分的混合权重，所有使用的 z 权重之和必须为 1。
    z_short: 0.24                   #模型中 z_short 部分的混合权重，所有使用的 z 权重之和必须为 1。
    scan_topic: scan                #要订阅的激光雷达

    # Initial Pose
    set_initial_pose: True #AMCL 从 initial_pose* 参数设置初始姿势，而不是等待 initial_pose 消息
    initial_pose.x: 0.0
    initial_pose.y: 0.0
    initial_pose.z: 0.0
    initial_pose.yaw: 0.0
    #Amcl参数解释参考：https://docs.nav2.org/configuration/packages/configuring-amcl.html
    always_reset_initial_pose: false
    first_map_only: true
    tf_good_pose_timeout: 1.0
    initial_manhattan_pose: false 

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False


bt_navigator:
  ros__parameters:
    use_sim_time: False
    transform_tolerance: 0.5
    goal_reached_tol: 0.25
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom_combined
    bt_loop_duration: 10
    default_server_timeout: 20
    ########4.12
    max_recovery_retries: 2        # 只重试1次就放弃
    retry_behavior_tree: false     # 禁止行为树无限循环死磕
    #######4.12
    default_nav_through_poses_bt_xml: "/userdata/dev_ws/src/origincar/ylc_nav/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    default_nav_to_pose_bt_xml: "/userdata/dev_ws/src/origincar/ylc_nav/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    error_code_names:
      - compute_path_error_code 
      - follow_path_error_code

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.05            # 防止静止抖动
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.05
    odom_topic: /odom_combined
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10           # 小车移动距离短，调小
      movement_time_allowance: 15.0
    goal_checker: 
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.3
      stateful: True

    FollowPath:
    ###################################dwb
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True

      # ===================== 速度限制 =====================
      min_vel_x: 0.1
      min_vel_y: 0.0
      max_vel_x: 1.0              
      max_vel_y: 0.0
      max_vel_theta: 1.5         
      min_speed_xy: 0.0
      max_speed_xy: 1.0
      min_speed_theta: 0.0

      # ===================== 加减速 =====================
      acc_lim_x: 0.5            
      acc_lim_y: 0.0
      acc_lim_theta: 0.8          
      decel_lim_x: 1.0           
      decel_lim_y: 0.0
      decel_lim_theta: 0.8       

      # ===================== 轨迹采样 =====================
      vx_samples: 20
      vy_samples: 0
      vtheta_samples: 40
      sim_time: 1.5               
      linear_granularity: 0.05
      angular_granularity: 0.025

      transform_tolerance: 0.2

      # ===================== 目标精度） =====================
      xy_goal_tolerance: 0.15      
      yaw_goal_tolerance: 0.3    
      latch_xy_goal_tolerance: true

      # ===================== 停止速度阈值 =====================
      trans_stopped_velocity: 0.05
      rot_stopped_velocity: 0.05

      short_circuit_trajectory_evaluation: True
      stateful: True

      # ===================== 轨迹生成器 =====================
      trajectory_generator_name: "dwb_plugins::StandardTrajectoryGenerator"

      # ===================== 评价器（阿克曼必须删除 RotateToGoal） =====================
      critics: ["Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]

      # 评价器权重
      ObstacleFootprint.scale: 0.01
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.3
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.3
      PathDist.scale: 32.0
      GoalDist.scale: 24.0

      # 安全减速
      max_scaling_factor: 0.1
      scaling_speed: 0.25

      # 振荡抑制
      oscillation_reset_distance: 0.05
      oscillation_reset_angle: 0.05

      prune_plan: true
      prune_distance: 1.0
      allow_primitives: true #?

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom_combined
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      ############？true 4.1
      width: 8
      height: 8
      resolution: 0.1
      
      footprint: "[ [-0.2, -0.115], [-0.2, 0.115], [0.2, 0.115], [0.2, -0.115] ]"
      
      plugins: ["obstacle_layer","inflation_layer"]
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
  
        inflation_radius: 0.18 

        cost_scaling_factor: 20.0     
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          raytrace_max_range: 4.0
          raytrace_min_range: 0.1
          obstacle_max_range: 3.5
          obstacle_min_range: 0.1
          clearing: True
          marking: True
          queue_size: 3
      
      always_send_full_costmap: True

  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      downsample_costmap: true
      downsampling_factor: 2  
      static_map: true     
      rolling_window: false  
      width: 10           
      height: 10
      footprint: "[ [-0.2, -0.115], [-0.2, 0.115], [0.2, 0.115], [0.2, -0.115] ]"
      
      resolution: 0.1
      track_unknown_space: true

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 1.5
          obstacle_min_range: 0.0
      
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
       
        inflation_radius: 0.18     
        cost_scaling_factor: 20.0     
      
      always_send_full_costmap: True

  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "turtlebot3_world.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True


planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    use_sim_time: False
    expected_planner_frequency: 5.0
    default_tolerance: 1.5 
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 1.5
      downsample_costmap: true
      downsampling_factor: 2
      allow_unknown: true
      max_iterations: 25000
      max_on_approach_iterations: 1000
      max_planning_time: 0.5
      
      motion_model_for_search: "REEDS_SHEPP"

      cost_travel_multiplier: 10.0
      angle_quantization_bins: 64
      analytic_expansion_ratio: 3.5

      min_turning_radius: 0.40
      
      reverse_penalty: 100.0
      change_penalty: 0.1
      non_straight_penalty: 0.2
      
      cost_penalty: 4.5
      lookup_table_size: 8.0
      cache_obstacle_heuristic: True
      smoother:
        max_iterations: 1000
        w_smooth: 0.4
        w_data: 0.2
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["wait"]

    wait:
      plugin: "nav2_behaviors/Wait"
      wait_time: 0.1

    global_frame: odom_combined
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.4
    min_rotational_vel: 0.05
    rotational_acc_lim: 2.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    loop_rate: 15
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    max_velocity: [1.2, 0.0, 2.5]
    min_velocity: [-1.2, 0.0, -2.5]
    max_accel: [1.5, 0.0, 2.0]
    max_decel: [-4.5, 0.0, -3.0]
    deadband_velocity: [0.05, 0.0, 0.05]
    velocity_timeout: 0.25

