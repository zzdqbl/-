planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    use_sim_time: False
    expected_planner_frequency: 2.0
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.3                      # 小车精度要求高，容差调小
      downsample_costmap: true
      downsampling_factor: 2
      lethal_cost_threshold: 255
      allow_unknown: true
      max_iterations: 25000
      max_on_approach_iterations: 0
      max_planning_time: 0.08
      motion_model_for_search: "REEDS_SHEPP"

      cost_travel_multiplier: 30.0 ##3.22——18 3/31 10.8
      # 这也是一个乘数，用于平衡“行驶距离”和“地图代价值”之间的权重。10！！！！
      # 如果路径太长但很安全，或者路径很短但很危险，这个参数用来权衡。通常与 cost_penalty 配合使用。
      angle_quantization_bins: 128
      analytic_expansion_ratio: 6.0
      
      # 👇 关键修正：最小转弯半径
      # 0.22m 宽的小车，通常转弯半径在 0.3~0.4m 左右
      # 如果实际车更小，可以试着降到 0.303.31/0.35

      min_turning_radius: 0.38
      
      reverse_penalty: 5.7
      #####3.31/5.0
      change_penalty: 0.4
      ######3.31/0.2
      non_straight_penalty: 0.5   
      # non_straight_penalty含义：非直线行驶惩罚（转弯惩罚）。
      # 作用：当小车转弯（而不是走直线）时，路径成本会增加。
      # 效果：
      # 设得大：小车喜欢走直线，只有在必须避障或掉头时才转弯，路径会比较生硬（折线多）。
      # 设得小：小车不介意频繁转弯，路径可能更平滑但也更琐碎。
      
      cost_penalty: 5.0   #!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!3.19---10.0/3.2225!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
      # 含义：代价值乘数。3/31 3.0
      # 作用：它将代价地图（Costmap）上的原始代价值（0~255）放大 10 倍后计入路径总成本。
      # 公式逻辑：路径段成本 = 距离 + (地图代价值 * cost_penalty)。
      # 效果：
      # 调大 (如 20.0)：规划器极度厌恶靠近障碍物（蓝色区域）。它会绕很远的路也要走在白色（自由空间）中心。路径非常安全，但可能绕远。
      # 调小 (如 2.0)：规划器不太在乎靠近障碍物。它可能会贴着蓝色区域边缘走，甚至穿过浅蓝色区域以缩短距离。路径更短，但风险更高。
      # 关联：这就是控制规划器如何利用你之前调整的 inflation_radius 和 cost_scaling_factor 的关键参数。
      lookup_table_size: 8.0
      cache_obstacle_heuristic: True

      use_quadratic_cost: true
      prefer_prev_path: true              # 优先沿用之前的路径，不乱换
      previous_path_velocity_weight: 0.9  # 加大对旧路径的惯性
      alternative_path_threshold: 0.5    # 只有明显更优才换路


      smoother:
        max_iterations: 1000
        w_smooth: 0.5
        w_data: 0.2
        tolerance: 1.0e-10
